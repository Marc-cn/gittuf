name: SBOMit Attestation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write  # needed for OIDC
  contents: write

jobs:
  sbomit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install witness
        run: |
          # Check if project ships its own witness binary
          if [ -f "./witness" ] && ./witness version 2>/dev/null | grep -q "ebpf\|eBPF\|bpf"; then
            echo "Using project-provided witness binary with eBPF support"
            sudo mv ./witness /usr/local/bin/witness
          elif command -v witness &>/dev/null && witness version 2>/dev/null | grep -q "ebpf\|eBPF\|bpf"; then
            echo "Using existing witness binary with eBPF support"
          else
            echo "Installing witness v0.11.0 from official release (ptrace only)"
            curl -sSL https://github.com/in-toto/witness/releases/download/v0.11.0/witness_0.11.0_linux_amd64.tar.gz -o witness.tar.gz
            tar -xzf witness.tar.gz
            sudo mv witness /usr/local/bin/witness
          fi
          witness version

      - name: Generate ephemeral signing key
        run: |
          openssl genpkey -algorithm ed25519 -out signing.key
          openssl pkey -in signing.key -pubout -out signing.pub

      - name: Attest build with witness
        run: |
          # Use eBPF if supported, fall back to ptrace
          TRACE_BACKEND=""
          if witness run --help 2>&1 | grep -q "trace-backend"; then
            TRACE_BACKEND="--trace-backend ebpf"
          fi
          sudo witness run \
            --step build \
            --trace $TRACE_BACKEND \
            --attestations "environment,git" \
            --signer-file-key-path signing.key \
            --outfile attestation.json \
            -- make build

      - name: Upload attestation + generate SBOM
        run: |
          mkdir -p sbom
          curl -sf -X POST "${{ vars.SBOMIT_SERVER }}/generate?name=gittuf-fork" \
            -H "Authorization: Bearer ${{ secrets.SBOMIT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @attestation.json \
            -o sbom/sbom.spdx.json || echo "WARN: server upload failed (server may not be reachable)"
          echo "==> Upload step complete"

      - name: Commit SBOM to repository
        if: github.event_name == 'push'
        run: |
          git config user.name  "sbomit-bot"
          git config user.email "sbomit-bot@users.noreply.github.com"
          git add sbom/sbom.spdx.json
          git diff --staged --quiet || git commit -m "chore: update SBOM [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/sbom.spdx.json
          retention-days: 90
